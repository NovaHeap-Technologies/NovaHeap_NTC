sentence=NTC thermistor temperature with the Beta or Steinhart-Hart equation, and open and shorted sensor detection.
paragraph=Defaults suit the common 10k B3950 thermistor; set any Beta value, Steinhart-Hart coefficients, or three points from the datasheet table. Ratiometric, smoothed readings with one call per loop. Reports a disconnected or shorted sensor instead of a wrong temperature, so thermostats can fail safe. No delay(), no dynamic memory, runs on any board.
